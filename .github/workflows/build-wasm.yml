name: build-lhzb2hall-wasm

# 官方 MAME 0.289 + 厅用接口补丁（只改 igs017.cpp，不 fork 驱动、不加驱动文件）
# 产物走 Release 资产：本机能通 api/upload/objects，但 actions.githubusercontent.com（artifact）不通。

on:
  workflow_dispatch:
  push:
    paths:
      - "hall/apply_hall_api_v10.py"
      - "hall/apply_hall_api_v11.py"
      - "hall/apply_hall_api_v12.py"
      - "hall/apply_hall_api_v13.py"
      - ".github/workflows/build-wasm.yml"

permissions:
  contents: write      # 发布 Release 资产需要（上一轮就是这里 403：Resource not accessible by integration）

env:
  MAME_VER: mame0289
  SUBTARGET: lhzb2hall

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 取 MAME ${{ env.MAME_VER }} 源码
        run: |
          set -e
          curl -sSL "https://codeload.github.com/mamedev/mame/tar.gz/refs/tags/${MAME_VER}" -o mame.tar.gz
          mkdir -p mame && tar -xzf mame.tar.gz -C mame --strip-components=1
          test -f mame/src/mame/igs/igs017.cpp

      - name: 打厅用接口补丁（锚点不对就当场失败，绝不静默改坏）
        run: |
          set -e
          cp mame/src/mame/igs/igs017.cpp mame/src/mame/igs/igs017.cpp.orig
          cd mame
          python3 ../hall/apply_hall_api_v13.py
          diff -u src/mame/igs/igs017.cpp.orig src/mame/igs/igs017.cpp | head -60 || true

      - name: 装 Emscripten（官方要求 6.0.2+）
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y ninja-build python3
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install 6.0.2
          ./emsdk activate 6.0.2

      - name: 准备 SDL3 依赖
        run: |
          set -e
          source "$HOME/emsdk/emsdk_env.sh"
          cd "$HOME/emsdk"
          embuilder build sdl3 sdl3_ttf

      - name: 编译 wasm 核心（只含这一族驱动）
        env:
          # 导出 JS 需要的运行期方法：写 ROM 进虚拟文件系统(FS)、自控启动参数(callMain)、内存视图
          # 只在链接期有意义；编译期会被忽略并告警，而 MAME 开 -Werror ⇒ 必须压掉那一条
          # =all：只加不减。上一版列白名单把 MAME 胶水自己依赖的 Module.cwrap 挤掉了
          # （页面报 "Module.cwrap is not a function"），=all 保留官方默认导出
          # 必须含 cwrap：实测胶水自己调用 Module.cwrap 13 次（=all 这版不认，白名单漏 cwrap 也会崩）
          # LEGACY_GL_EMULATION：MAME 渲染器用 GL1.1 固定管线（实测链接期报 glShadeModel/glColor4f/glVertex2f
          # 未定义，页面 abort(missing function: glShadeModel)；-video soft/bgfx 都被 OSD 拒 "Unknown system"
          EMCC_CFLAGS: "-sEXPORTED_RUNTIME_METHODS=FS,cwrap,ccall,callMain,HEAPU8,stackAlloc,stringToUTF8,UTF8ToString,lengthBytesUTF8,addRunDependency,removeRunDependency -sLEGACY_GL_EMULATION=1 -sGL_UNSAFE_OPTS=0 -sMAX_WEBGL_VERSION=2 -Wno-unused-command-line-argument -Wno-error=unused-command-line-argument"
        run: |
          set -e
          source "$HOME/emsdk/emsdk_env.sh"
          echo "EMCC_CFLAGS=$EMCC_CFLAGS"
          cd mame
          emmake make SUBTARGET=${SUBTARGET} \
            SOURCES=src/mame/igs/igs017.cpp \
            -j"$(nproc)" O=emscripten

      - name: 收集产物
        run: |
          set -e
          mkdir -p out
          find mame -maxdepth 4 \( -name "${SUBTARGET}.js" -o -name "${SUBTARGET}.wasm" \) | tee list.txt
          test -s list.txt || { echo "找不到产物"; find mame -name "*.wasm" | head -20; exit 1; }
          while read -r f; do cp "$f" out/; done < list.txt
          ls -la out
          tar -czf "${SUBTARGET}-wasm.tar.gz" -C out .

      - name: 发布 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wasm-${{ github.run_number }}
          name: lhzb2hall wasm build ${{ github.run_number }}
          files: ${{ env.SUBTARGET }}-wasm.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
